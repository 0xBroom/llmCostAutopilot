# Calibration set for the complexity taxonomy (#10).
#
# Twenty-five UNLABELLED prompts. This file is the worksheet an annotator
# copies and fills in; `tier`, `label_reason`, `signals` and `edge_case` are
# deliberately empty here so that copying the file never leaks a label.
#
# `edge_case` is empty ON PURPOSE. Pre-filling it would hand the annotator the
# matching ruling from docs/complexity-taxonomy.md section 6 and inflate the
# agreement number — recognising which edge case applies is part of what the
# calibration is measuring.
#
# Composition, by design:
#   - all three tiers represented, with several deliberate boundary probes
#   - all seven declared edge cases covered at least once
#   - 2 non-English prompts, 3 multi-turn conversations
#   - DISJOINT from config/baseline_prompts.yaml. The #9 corpus prompts have
#     their rulings argued in the taxonomy document itself, so labelling them
#     would measure recall of the examples rather than clarity of the rubric.
#
# Labelling procedure: docs/complexity-taxonomy.md section 8.
# Agreement: python -m autopilot.interfaces.cli.kappa --help
version: 1
taxonomy_version: 1

