      - role: assistant
        content: |
          Weigh the commute most heavily: noise is something you adapt to and
          can partly fix with windows or a white-noise machine, while eighty
          minutes a day is roughly seven working weeks a year that you cannot
          get back. Visit the noisy flat at 8pm on a weekday before you
          decide, and ask what the windows are rated at.
      - role: user
        content: |
