  - id: cal-19
    language: en
    source: handwritten
    tier: null
    label_reason: ""
    signals: []
    edge_case: null
    messages:
      - role: user
        content: |
          We have one Postgres instance serving both our transactional
          workload and the analytics dashboards, and the dashboards are now
          slow enough that people have stopped using them. What are our
          options?
      - role: assistant
        content: |
          Three realistic paths: a read replica with the dashboards pointed at
          it, a nightly ETL into a columnar store, or materialised views
          refreshed on a schedule. The replica is the smallest change and buys
          you the least; the columnar store is the largest and buys you the
          most, including the ability to keep history the transactional
          database should not carry.
      - role: user
        content: |
          The replica sounds cheap but we will outgrow it. Assume we go with
          the columnar store — write the migration plan.

