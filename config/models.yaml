# The catalog DESCRIBES models. It holds no credentials and no endpoints:
# api_key and (for ollama) api_base are injected at Router construction from
# Settings. There is deliberately no `fallbacks:` key — fallback chains are
# derived from quality_tier by ModelCatalog.fallback_chain, which is what
# makes "a fallback never goes downward" structurally true instead of
# reviewed.
#
# Every provider_model_id below was verified this session to resolve against
# the exact installed litellm==1.95.0 bundled price map, via the loader's
# two-step key resolution (direct key, then the bare name after the first
# "/"), or to carry an explicit register_pricing/price override where it
# does not:
#
#   ollama_chat/llama3.1        -> absent from the map entirely; taught via
#                                   register_pricing below.
#   anthropic/claude-haiku-4-5  -> resolves bare, as "claude-haiku-4-5".
#   openai/gpt-4o               -> resolves bare, as "gpt-4o".
#   anthropic/claude-sonnet-4-5 -> resolves bare, as "claude-sonnet-4-5".

version: 1

models:
  # --- tier 1: local, free at the point of use --------------------------------
  - key: llama3-local
    provider: ollama
    provider_model_id: ollama_chat/llama3.1
    quality_tier: 1
    supports_json_mode: true
    max_context_tokens: 8192
    max_output_tokens: 2048
    # p50 from baseline run artifacts/baseline/2026-08-10 (repeats=3,
    # concurrency=2). NOTE: p95 was 19.4s, far over the 8s SLO — see that run's
    # outputs.md "What we learned". Local runs by default; set
    # AUTOPILOT_DISABLE_LOCAL=true to exclude it (the documented demo default).
    expected_latency_ms: 3582
    # litellm 1.95.0's map has "ollama/llama3" but NOT "ollama_chat/llama3.1",
    # so we teach it. Without this block the loader raises rather than
    # defaulting the price to zero.
    register_pricing:
      litellm_provider: ollama
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_input_tokens: 8192
      max_output_tokens: 8192

  # --- tier 2: cheap hosted ---------------------------------------------------
  - key: haiku-4-5
    provider: anthropic
    provider_model_id: anthropic/claude-haiku-4-5
    quality_tier: 2
    supports_json_mode: true
    expected_latency_ms: 1534  # p50, same baseline run (2026-08-10)
    # No price block: resolved from the bundled map. Note the map key is
    # "claude-haiku-4-5" WITHOUT the "anthropic/" prefix — the loader's
    # two-step resolution handles that.

  # --- tier 3: frontier, and the baseline we measure savings against ----------
  - key: gpt-4o
    provider: openai
    provider_model_id: openai/gpt-4o
    quality_tier: 3
    supports_json_mode: true
    expected_latency_ms: 1243  # p50, same baseline run (2026-08-10)
    baseline: true

  # --- tier 3: the judge ------------------------------------------------------
  - key: sonnet-4-5
    provider: anthropic
    provider_model_id: anthropic/claude-sonnet-4-5
    quality_tier: 3
    supports_json_mode: true
    expected_latency_ms: 2312  # p50, same baseline run (2026-08-10)
    judge: true
    judge_fallback: gpt-4o
    # No price block: resolved from the bundled map ("claude-sonnet-4-5" is
    # bare-key present). An earlier override (0.0000027/0.0000135) was carried
    # as a "negotiated rate" but was in fact a stale price — the baseline
    # harness (#9) surfaced the map disagreeing by 10% via the price-agreement
    # canary, and there is no actual discount, so the override was removed.
