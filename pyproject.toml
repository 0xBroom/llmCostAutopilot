[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Complexity-aware routing layer that sends each LLM request to the cheapest model capable of handling it, and continuously verifies that it was right."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "aiosqlite>=0.20",
    # Pinned EXACTLY, not with a range. LiteLLM ships its model price map
    # *inside the package*, so the version determines our cost figures. An
    # unreviewed minor bump can silently change every number in the savings
    # report. Upgrades are a reviewed change with a re-run of the benchmark.
    # See docs/adr/0001-litellm-as-provider-abstraction.md.
    "alembic>=1.14",
    "greenlet>=3.5.5",
    "litellm==1.95.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-recording>=0.13.4",
    "import-linter>=2.13",
    "pre-commit>=4.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

# ---------------------------------------------------------------- ruff ------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ANN",       # missing annotations
    "ASYNC",     # async gotchas
    "S",         # bandit
    "PTH",       # use pathlib
    "TID",       # tidy imports
    "ARG",       # unused arguments
    "DTZ",       # naive datetimes  <- pairs with the Clock port
    "T20",       # no print()
    "RET",       # return simplification
]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the contract
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG", "DTZ"]
"src/autopilot/interfaces/cli/**" = ["T20"]
# The write-path benchmark reports its measured latency to stdout on purpose.
"tests/integration/test_request_store.py" = ["S101", "ANN", "ARG", "DTZ", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["autopilot"]

[tool.ruff.format]
# Do not reformat Python snippets inside Markdown. Several of them are quoted
# verbatim from upstream provider documentation, and silently rewrapping them
# makes it harder for a reader to match our text against the original source.
exclude = ["*.md"]

# ---------------------------------------------------------------- mypy ------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The core is where the logic lives, so the core gets the full strict set.
# The edges (adapters, delivery) get the pragmatic baseline above.
[[tool.mypy.overrides]]
module = ["autopilot.domain.*", "autopilot.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
extra_checks = true
strict_equality = true
warn_unreachable = true

# litellm does not ship complete stubs.
[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `live` is deselected by default: the default suite must never spend money
# and must be runnable on a fork PR, where no secrets exist.
addopts = "-q -m 'not live' --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "live: hits real provider APIs. Costs money. Requires credentials. Opt-in only.",
    "contract: replays a recorded provider cassette. No network.",
    "integration: exercises our own services end to end. No external network.",
]
filterwarnings = ["error::DeprecationWarning:autopilot.*"]

# -------------------------------------------------------------- coverage ----

[tool.coverage.run]
branch = true
source = ["src/autopilot/domain", "src/autopilot/application"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",          # Protocol method bodies
    "raise NotImplementedError",
]
