[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Complexity-aware routing layer that sends each LLM request to the cheapest model capable of handling it, and continuously verifies that it was right."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "pyyaml>=6.0",
    "structlog>=25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "import-linter>=2.13",
    "pre-commit>=4.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

# ---------------------------------------------------------------- ruff ------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ANN",       # missing annotations
    "ASYNC",     # async gotchas
    "S",         # bandit
    "PTH",       # use pathlib
    "TID",       # tidy imports
    "ARG",       # unused arguments
    "DTZ",       # naive datetimes  <- pairs with the Clock port
    "T20",       # no print()
    "RET",       # return simplification
]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the contract
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG", "DTZ"]
"src/autopilot/interfaces/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["autopilot"]

[tool.ruff.format]
# Do not reformat Python snippets inside Markdown. Several of them are quoted
# verbatim from upstream provider documentation, and silently rewrapping them
# makes it harder for a reader to match our text against the original source.
exclude = ["*.md"]

# ---------------------------------------------------------------- mypy ------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ---------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
